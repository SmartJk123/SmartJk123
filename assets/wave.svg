<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" role="img" aria-label="Joy Kamau, Full-Stack Software Engineer building reliable digital solutions">
  <defs>
    <style>
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
      @keyframes fadein { 0% { opacity: 0; } 100% { opacity: 1; } }
      .tw { animation: twinkle 2.6s ease-in-out infinite; }
      .txt { animation: fadein 1.4s ease-out both; }
    </style>
    <linearGradient id="indigoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="0.75" stop-color="#818CF8"/>
      <stop offset="0.88" stop-color="#111827"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="goldFlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <path id="sparkle" d="M0,-9 L2.4,-2.4 L9,0 L2.4,2.4 L0,9 L-2.4,2.4 L-9,0 L-2.4,-2.4 Z"/>
  </defs>

  <rect width="1200" height="260" fill="url(#indigoGrad)"/>

  <!-- White glitter -->
  <g fill="#FFFFFF">
    <use href="#sparkle" transform="translate(110,58) scale(0.9)" class="tw" style="animation-delay:0s"/>
    <use href="#sparkle" transform="translate(252,128) scale(0.55)" class="tw" style="animation-delay:0.5s"/>
    <use href="#sparkle" transform="translate(392,46) scale(0.7)" class="tw" style="animation-delay:1.1s"/>
    <use href="#sparkle" transform="translate(524,94) scale(0.4)" class="tw" style="animation-delay:0.2s"/>
    <use href="#sparkle" transform="translate(706,52) scale(0.8)" class="tw" style="animation-delay:0.9s"/>
    <use href="#sparkle" transform="translate(832,138) scale(0.5)" class="tw" style="animation-delay:0.3s"/>
    <use href="#sparkle" transform="translate(962,58) scale(0.65)" class="tw" style="animation-delay:1.4s"/>
    <use href="#sparkle" transform="translate(1082,118) scale(0.45)" class="tw" style="animation-delay:0.6s"/>
  </g>

  <!-- Gold glitter -->
  <g fill="#FFD700">
    <use href="#sparkle" transform="translate(168,172) scale(0.6)" class="tw" style="animation-delay:0.7s"/>
    <use href="#sparkle" transform="translate(330,92) scale(0.75)" class="tw" style="animation-delay:0.1s"/>
    <use href="#sparkle" transform="translate(470,168) scale(0.45)" class="tw" style="animation-delay:1.2s"/>
    <use href="#sparkle" transform="translate(610,38) scale(0.55)" class="tw" style="animation-delay:0.4s"/>
    <use href="#sparkle" transform="translate(764,150) scale(0.7)" class="tw" style="animation-delay:0.8s"/>
    <use href="#sparkle" transform="translate(892,82) scale(0.6)" class="tw" style="animation-delay:0.2s"/>
    <use href="#sparkle" transform="translate(1024,166) scale(0.5)" class="tw" style="animation-delay:1s"/>
    <use href="#sparkle" transform="translate(1142,54) scale(0.7)" class="tw" style="animation-delay:0.5s"/>
  </g>

  <!-- Tiny glint dots -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="155" cy="95" r="1.6"/>
    <circle cx="448" cy="52" r="1.4"/>
    <circle cx="648" cy="82" r="1.5"/>
    <circle cx="875" cy="160" r="1.6"/>
    <circle cx="1035" cy="95" r="1.4"/>
    <circle cx="1180" cy="150" r="1.5"/>
  </g>

  <!-- Title -->
  <g class="txt" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
    <text x="600" y="112" font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="1">Joy Kamau</text>
    <text x="600" y="168" font-size="21" fill="#E0E7FF">Full-Stack Software Engineer | Building Reliable Digital Solutions</text>
  </g>

  <!-- Black flow at the lower part, with a touch of gold along the crest -->
  <path d="M0,224 C100,202 200,246 300,224 C400,202 500,246 600,224 C700,202 800,246 900,224 C1000,202 1100,246 1200,224 L1200,260 L0,260 Z" fill="#050505"/>
  <path d="M0,224 C100,202 200,246 300,224 C400,202 500,246 600,224 C700,202 800,246 900,224 C1000,202 1100,246 1200,224" fill="none" stroke="url(#goldFlow)" stroke-width="2.5" stroke-linecap="round"/>
</svg>